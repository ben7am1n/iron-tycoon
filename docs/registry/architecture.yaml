    status: active
    pattern: direct_call
    producer: adr-0001
    consumers:
      - All 12 simulation systems
    adr: docs/architecture/adr-0001-di-container-scene-bootstrap.md
    signal_signature: "init(...) -> void // two-phase: init() stores refs, _post_init() performs side effects"
    referenced_by:
      - docs/architecture/adr-0001-di-container-scene-bootstrap.md
