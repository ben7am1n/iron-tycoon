# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: sim_system_base_class
    status: active
    api: "SimSystem extends RefCounted (@abstract)"
    not: "Node or Resource base class for simulation systems"
    adr: docs/architecture/adr-0001-di-container-scene-bootstrap.md
    reason: "RefCounted is lighter than Node (no scene-tree overhead). Two-phase init (init() + _post_init()) works around GDScript RefCounted constructor limitations. @abstract enforces that SimSystem cannot be instantiated directly (Godot 4.5+, needs 4.7.1 verification)."
    referenced_by:
      - docs/architecture/adr-0001-di-container-scene-bootstrap.md
    added: 2026-07-21
    revised: ""

  - purpose: storage_format_save
    status: active
    api: "JSON (.sav.json) with hex-encoded 64-bit integers for master_seed and RNG states"
    not: "Godot Resource (.tres/.res) for runtime save data; JSON number literals for 64-bit values"
    adr: docs/architecture/adr-0002-storage-format.md
    reason: "JSON is debuggable, VCS-diffable, and works in headless CI. Hex encoding prevents IEEE 754 truncation of 64-bit ints in JSON. Godot Resources couple to editor resource cache and fail in headless mode."
    referenced_by:
      - docs/architecture/adr-0002-storage-format.md
    added: 2026-07-21
    revised: ""

  - purpose: storage_format_catalog
    status: active
    api: "JSON (.catalog.json) with JSON.new() + json.parse() for line-number error reporting"
    not: "Godot Resource (.tres) for designer-authored catalog data"
    adr: docs/architecture/adr-0002-storage-format.md
    reason: "Designer-authored data must be hand-editable and VCS-diffable. JSON.new().parse() provides line-number context for validation errors."
    referenced_by:
      - docs/architecture/adr-0002-storage-format.md
    added: 2026-07-21
    revised: ""

  - purpose: storage_format_level
    status: active
    api: "Binary (.level.bin) — 28-byte header (7x int32 LE) + buildable mask (width*height bytes)"
    not: "JSON or text format for level geometry"
    adr: docs/architecture/adr-0002-storage-format.md
    reason: "Level geometry is a large binary blob with no human-editing use case. Binary format is compact and fast to parse."
    referenced_by:
      - docs/architecture/adr-0002-storage-format.md
    added: 2026-07-21
    revised: ""

  - purpose: grid_read_write_split
    status: active
    api: "GridStateReader (@abstract extends SimSystem) for reads; GridSystem subclass for writes"
    not: "Single GridSystem class exposing both read and write to all consumers"
    adr: docs/architecture/adr-0003-grid-state-reader.md
    reason: "Type-level enforcement of read-only access. Consumers typed as GridStateReader cannot call commit()/clear() — those methods exist only on GridSystem. GridSnapshot implements the same interface for speculative views. Follows the @abstract pattern established by ADR-0001."
    referenced_by:
      - docs/architecture/adr-0003-grid-state-reader.md
    added: 2026-07-21
    revised: ""

  - purpose: rng_subseed_derivation
    status: active
    api: "FNV-1a64(name) XOR master_seed → SplitMix64 finalizer → RandomNumberGenerator.seed"
    not: "GDScript hash() for seed derivation; shared master RNG stream with sequential draws; master_seed + hash(name) without finalizer"
    adr: docs/architecture/adr-0004-seeded-rng-architecture.md
    reason: "Per-system RNG sub-streams derived through a published, language-agnostic pipeline (FNV-1a64 + SplitMix64) ensure that each system's randomness is independent of every other system's draw count. GDScript hash() is explicitly not stable across engine versions. SplitMix64 finalizer provides avalanche so similarly-named systems produce unrelated sub-streams. Logical right-shift (lsr()) is mandatory because GDScript >> is arithmetic."
    referenced_by:
      - docs/architecture/adr-0004-seeded-rng-architecture.md
    added: 2026-07-21
    revised: ""

  - purpose: astar_determinism_gate
    status: active
    api: "AStarGrid2D cross-process tie-break stability test + lexicographic path selector fallback if non-deterministic"
    not: "Assuming AStarGrid2D tie-break is deterministic without physical cross-process verification; serializing AStarGrid2D internal state (opaque, undocumented)"
    adr: docs/architecture/adr-0007-astargrid2d-determinism.md
    reason: "SaveLoad determinism requires that Navigation produces the same paths after rebuilding AStarGrid2D from restored occupancy. AStarGrid2D internal tie-break is undocumented and may depend on heap addresses or pointer order that changes across process restarts. A physical cross-process gate test proves or disproves determinism; if disproven, a lexicographic path selector fallback guarantees it in our own code."
    referenced_by:
      - docs/architecture/adr-0007-astargrid2d-determinism.md
    added: 2026-07-21
    revised: ""

