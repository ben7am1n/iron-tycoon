# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_autoload_coupling
    status: active
    description: "Simulation systems must not reference Autoload singletons by name. All dependencies must be passed via init() parameters."
    why: "Tight coupling to Autoloads makes systems untestable in isolation and creates hidden dependencies. Violates the project's DI-over-Autoload requirement."
    adr: docs/architecture/adr-0001-di-container-scene-bootstrap.md
    added: 2026-07-21
  - pattern: simulation_system_as_node
    status: active
    description: "Simulation systems (GridSystem, TimeSystem, PlacementSystem, Navigation, MemberSim, Congestion, ZoneRules, Satisfaction, Economy, Shop, SelectionSystem, SaveLoad) must extend SimSystem (RefCounted), not Node. Input-requiring systems use thin bridge Nodes that forward events to the RefCounted system."
    why: "Node class carries scene-tree overhead (~100+ bytes per instance), lifecycle callbacks (_ready, _process, _exit_tree) that are inappropriate for pure simulation logic, and couples systems to the engine's object model. RefCounted is lighter, headless-testable, and avoids lifecycle callback confusion."
    adr: docs/architecture/adr-0001-di-container-scene-bootstrap.md
    added: 2026-07-21
  - pattern: direct_grid_state_mutation
    status: active
    description: "Consumers must not modify PlacedInstance fields returned by GridStateReader.get_placed_instances(). Grid occupancy data must only be written through GridSystem.commit() and GridSystem.clear()."
    why: "PlacedInstance objects are shared by reference between the base grid and speculative snapshots (GridSnapshot). Mutating a PlacedInstance would corrupt both the real grid state and any in-flight speculative views. The type system cannot enforce this — GDScript has no readonly/final field modifier — so it is enforced by convention and code review."
    adr: docs/architecture/adr-0003-grid-state-reader.md
    added: 2026-07-21

